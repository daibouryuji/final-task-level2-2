<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" href="img/signup.jpg" sizes="32x32" type="image/png">

    <style>
        :root {
            --primary-color: #8b5cf6;
            --secondary-color: #ec4899;
            --dark-bg: #18181b;
        }


        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-color) 50%, var(--secondary-color) 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: block;
        }

        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;

        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.3), transparent);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 8s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: -1;
        }

        .register-container {
            margin: 80px auto;
            padding: 20px;
            max-width: 480px;
        }


        .reister-card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }



        .register-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
            margin-bottom: 20px;
        }

        .register-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
        }

        .form-group {
            color: rgb(255, 250, 250);
            margin-bottom: 10px;
        }

        .some-right {
            margin-left: 80%;
            margin-top: 15px;

        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);

        }

        .login-link {
            position: absolute;
            top: 90px;
            left: 30px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);

        }
    </style>

</head>

<body>
    <a href="index.html" class="back-link">
        <i class="bi bi-arrow-left-circle"></i>ホームに戻る</a>
    <a href="music-login-page.html" class="login-link">
        <i class="bi bi-arrow-left-circle"></i>ログイン画面に戻る</a>

    <div class="register-container mt-4">
        <div class="register-card">
            <!-- ログインヘッダー -->
            <div class="register-header">
                <div class="register-icon">
                    <i class="bi bi-music-note-beamed"></i>
                </div>
                <h2 class="fw-bold mb-2">LiveHub</h2>
                <p class="mb-0">音楽で繋がる、最高の体験を</p>
            </div>

            <div class="register-body">
                <form id="registerForm">
                    <!--メールアドレス-->

                    <div class="form-group">
                        <label for="exampleInputEmail1">メールアドレス</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                            placeholder="example@email.com">
                        <small id="emailHelp" class="form-text text-muted">
                            あなたのメールアドレスは公開されません
                        </small>
                    </div>

                    <!--パスワード-->
                    <div class="form-group">
                        <label for="exampleInputPassword1">パスワード</label>
                        <input type="password" class="form-control" id="exampleInputPassword1"
                            placeholder="パスワードを必ず入力してください">
                    </div>
                    <!--ユーザー名-->
                    <div class="form-group">
                        <label for="exampleInputPassword1">ユーザー名</label>
                        <input type="password" class="form-control" id="exampleInputPassword1"
                            placeholder="ユーザー名はプロフィールから変更することができます">
                    </div>

                    <a href="music-login-page.html" class="btn btn-success btn-lg active some-right" role="button"
                        aria-pressed="true">登録</a>
                </form>
            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous">
    </script>

</html>
