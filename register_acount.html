<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント登録 - LiveHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- ★ CSSはそのまま（変更なし） -->
    <style>
        /* 貼ってくれたCSSをそのまま使用 */
        :root {
            --primary-color: #8b5cf6;
            --secondary-color: #ec4899;
            --dark-bg: #18181b;
        }
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-color) 50%, var(--secondary-color) 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 6s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.3), transparent);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 8s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        .login-container {
            max-width: 480px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
            margin: 60px auto;
        }
        .login-card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }
        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
        }
        .login-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
        }
        .login-body { padding: 40px; }
        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 14px;
            font-size: 1.1rem;
            border: none;
            font-weight: bold;
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body>

    <!-- 戻るボタン -->
    <a href="index.html" class="back-link">
        <i class="bi bi-arrow-left-circle"></i> ホームに戻る
    </a>

    <div class="login-container">
        <div class="login-card">

            <!-- ☆ ここを新規登録用に変更 -->
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h2 class="fw-bold mb-2">新規アカウント登録</h2>
                <p class="mb-0">LiveHub をはじめよう</p>
            </div>

            <div class="login-body">
                <form id="registerForm">

                    <!-- 名前 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">名前</label>
                        <input type="text" id="name" class="form-control form-control-lg" placeholder="山田 太郎" required>
                    </div>

                    <!-- メール -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">メールアドレス</label>
                        <input type="email" id="email" class="form-control form-control-lg" placeholder="example@email.com" required>
                    </div>

                    <!-- パスワード -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">パスワード</label>
                        <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>

                    <!-- パスワード確認 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">パスワード確認</label>
                        <input type="password" id="passwordConfirm" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>

                    <!-- 登録ボタン -->
                    <button type="submit" class="btn btn-login w-100 mb-3">
                        <i class="bi bi-check-circle"></i> 登録する
                    </button>

                    <!-- エラー表示 -->
                    <div class="alert alert-danger d-none" id="errorAlert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        入力内容を確認してください
                    </div>
                </form>

                <!-- ログインへのリンク -->
                <div class="text-center mt-3">
                    <p class="text-muted mb-0">
                        すでにアカウントをお持ちですか？
                        <a href="./music-login-page.html" class="fw-bold" style="color: var(--primary-color);">ログイン</a>
                    </p>
                </div>
            </div>
        </div>

        <p class="text-center text-white mt-4 small">&copy; 2024 LiveHub</p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const pw = document.getElementById("password").value;
            const pw2 = document.getElementById("passwordConfirm").value;

            if (!name || !email || !pw || pw !== pw2) {
                document.getElementById("errorAlert").classList.remove("d-none");
                return;
            }

            alert("登録完了！ ログイン画面へ移動します。");
            window.location.href = "./music-login-page.html";
        });
    </script>

</body>
</html>
